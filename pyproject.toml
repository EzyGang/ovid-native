[project]
name = "ovid-native"
version = "0.1.0"
description = "Complete native Rust operations and Ovid tool integrations for Ovid applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "pydantic-ai", "rust", "search", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
authors = [
    { name = "Galtozzy", email = "galtozzy+git@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ovid-core>=0.1.0,<0.2.0",
    "lark>=1.2.2,<2",
]

[project.optional-dependencies]
# Native operations ship in every wheel; extras select Python-only dependencies.
ast = []
search = []
fff = []
files = []
all = []

[project.urls]
Documentation = "https://github.com/EzyGang/ovid-core/tree/main/docs/content/native"
Issues = "https://github.com/EzyGang/ovid-native/issues"
Repository = "https://github.com/EzyGang/ovid-native"

[build-system]
requires = ["maturin>=1.9.4,<2.0.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.2",
    "maturin>=1.9.4,<2.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "taskipy>=1.14.1",
    "ty>=0.0.65",
]

benchmark = [
    "pyperf>=2.9,<3",
]

[tool.uv.sources]
ovid-core = { path = "../ovid-core", editable = true }

[tool.maturin]
bindings = "pyo3"
module-name = "ovid_native._native"
python-source = "python"
strip = true
include = [{ path = ".cargo/config.toml", format = "sdist" }]

[tool.taskipy.tasks]
format-and-lint = "task ruff && task ty-lint && task rust-lint"

ruff = "ruff format ./python/ovid_native ./tests ./benchmarks && ruff check ./python/ovid_native ./tests ./benchmarks --fix --unsafe-fixes"
tests = "pytest ./tests -v"
ruff-lint = "ruff check ./python/ovid_native ./tests ./benchmarks"
ty-lint = "ty check ./python/ovid_native"

rust = "cargo fmt --all"
rust-lint = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
rust-tests = "cargo test --all-targets --all-features"
build = "maturin build --release --compatibility pypi --sdist"
benchmark = "python -m benchmarks.run --fast"
benchmark-record = "maturin develop --release && python -m benchmarks.run --rigorous --release-extension"
benchmark-report = "python -m benchmarks.report"
benchmark-compare = "python -m benchmarks.compare"
benchmark-check = "ty check ./benchmarks && python -m benchmarks.run --debug-single-value --scenario glob.exact_file.10k --scenario grep.literal_sparse.10k --scenario ast.search_sparse.2k --scenario fff.find_typo.small.100 --scenario fff.grep_plain_sparse.small.100"

[tool.ruff]
line-length = 120
extend-exclude = ["site-packages", "*.pyi"]
target-version = 'py314'

[tool.ruff.lint]
extend-select = ["ANN", "PYI", "PGH003"]
preview = true
fixable = ["ALL"]
unfixable = []
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'auto'
skip-magic-trailing-comma = false
exclude = ['*.pyi']

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 2
known-first-party = ["ovid_native"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=ovid_native",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.coverage.run]
branch = true
source = ["ovid_native"]
omit = ["python/ovid_native/_native.pyi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
