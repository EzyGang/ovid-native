[project]
name = "ovid-native"
version = "0.1.0"
description = "Complete native Rust operations and Ovid tool integrations for Ovid applications"
authors = [
    { name = "Galtozzy", email = "galtozzy+git@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ovid-core>=0.1.0,<0.2.0",
]

[build-system]
requires = ["maturin>=1.9.4,<2.0.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.2",
    "maturin>=1.9.4,<2.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "taskipy>=1.14.1",
    "ty>=0.0.65",
]

[tool.uv.sources]
ovid-core = { path = "../ovid-core", editable = true }

[tool.maturin]
bindings = "pyo3"
module-name = "ovid_native._native"
python-source = "python"
strip = true

[tool.taskipy.tasks]
format-and-lint = "task ruff && task lint && rust-lint && task rust-format"

ruff = "ruff format ./python/ovid_native ./tests && ruff check ./python/ovid_native ./tests --fix --unsafe-fixes"
tests = "pytest ./tests -v"
ruff-lint = "ruff check ./src/ovid_core"
ty-lint = "ty check ./python/ovid_native"

rust = "cargo fmt --all"
rust-lint = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
rust-tests = "cargo test --all-targets --all-features"
build = "maturin build --release --compatibility pypi --sdist"

[tool.ruff]
line-length = 120
extend-exclude = ["site-packages", "*.pyi"]
target-version = 'py314'

[tool.ruff.lint]
extend-select = ["ANN", "PYI", "PGH003"]
preview = true
fixable = ["ALL"]
unfixable = []
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'auto'
skip-magic-trailing-comma = false
exclude = ['*.pyi']

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 2
known-first-party = ["ovid_native"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=ovid_native",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.coverage.run]
branch = true
source = ["ovid_native"]
omit = ["python/ovid_native/_native.pyi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
