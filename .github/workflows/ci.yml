name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          # The Ubuntu test job saves the same cache key. Two writers of one key race.
          save-cache: false
          cache-dependency-glob: |
            uv.lock
            ../ovid-core/uv.lock
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ovid-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: uv sync --locked --no-install-project
        working-directory: ovid-native
      # `uv run` without `--no-sync` installs the project, which compiles a release build of the extension.
      - name: Check Python formatting and lint
        run: |
          uv run --no-sync ruff format --check ./python/ovid_native ./tests ./benchmarks
          uv run --no-sync ruff check ./python/ovid_native ./tests ./benchmarks
        working-directory: ovid-native
      - name: Check Python types
        run: uv run --no-sync task ty-lint
        working-directory: ovid-native
      - name: Check Rust formatting and lint
        run: uv run --no-sync task rust-lint
        working-directory: ovid-native

  tests:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            ../ovid-core/uv.lock
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ovid-native
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: uv sync --locked --no-install-project
        working-directory: ovid-native
      # `uv run` without `--no-sync` installs the project, which compiles a release build of the extension.
      - name: Run Rust tests
        run: uv run --no-sync task rust-tests
        working-directory: ovid-native
      - name: Build development extension
        run: uv run --no-sync maturin develop
        working-directory: ovid-native
      - name: Run Python tests
        run: uv run --no-sync task tests
        working-directory: ovid-native
      # Pull requests test the development build. The release build runs on main and on manual runs.
      - name: Build release wheel
        if: github.event_name != 'pull_request'
        run: uv run --no-sync maturin build --release --compatibility pypi
        working-directory: ovid-native
      - name: Build source distribution
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: uv run --no-sync maturin sdist
        working-directory: ovid-native
      - name: Upload distributions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ runner.os }}
          path: ovid-native/target/wheels/*
          if-no-files-found: error
          retention-days: 7
