name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          cache-dependency-glob: |
            ovid-native/uv.lock
            ovid-core/uv.lock
      - name: Install dependencies
        run: uv sync --locked
        working-directory: ovid-native
      - name: Check Python formatting and lint
        run: |
          uv run ruff format --check ./python/ovid_native ./tests ./benchmarks
          uv run ruff check ./python/ovid_native ./tests ./benchmarks
        working-directory: ovid-native
      - name: Check Python types
        run: uv run ty check ./python/ovid_native
        working-directory: ovid-native
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ovid-native
      - name: Run Rust tests
        run: cargo test --all-targets --all-features
        working-directory: ovid-native
      - name: Build development extension
        run: uv run maturin develop
        working-directory: ovid-native
      - name: Run Python tests
        run: uv run pytest ./tests -v
        working-directory: ovid-native
