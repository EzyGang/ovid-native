name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          cache-dependency-glob: |
            ovid-native/uv.lock
            ovid-core/uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-install-project
        working-directory: ovid-native
      - name: Check Python formatting and lint
        run: |
          uv run ruff format --check ./python/ovid_native ./tests ./benchmarks
          uv run ruff check ./python/ovid_native ./tests ./benchmarks
        working-directory: ovid-native
      - name: Check Python types
        run: uv run task ty-lint
        working-directory: ovid-native
      - name: Check Rust formatting and lint
        run: uv run task rust-lint
        working-directory: ovid-native

  tests:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          cache-dependency-glob: |
            ovid-native/uv.lock
            ovid-core/uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-install-project
        working-directory: ovid-native
      - name: Run Rust tests
        run: uv run task rust-tests
        working-directory: ovid-native
      - name: Build development extension
        run: uv run maturin develop
        working-directory: ovid-native
      - name: Run Python tests
        run: uv run task tests
        working-directory: ovid-native
      - name: Build release wheel
        run: uv run maturin build --release --compatibility pypi
        working-directory: ovid-native
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: uv run maturin sdist
        working-directory: ovid-native
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ runner.os }}
          path: ovid-native/target/wheels/*
          if-no-files-found: error
          retention-days: 7
