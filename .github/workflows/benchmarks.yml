name: Benchmark smoke

on:
  pull_request:
    paths:
      - '.github/workflows/benchmarks.yml'
      - 'benchmarks/**'
      - 'python/ovid_native/ast/**'
      - 'python/ovid_native/fff/**'
      - 'python/ovid_native/search/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
      - name: Install benchmark environment
        run: uv sync --group benchmark
        working-directory: ovid-native
      - name: Run benchmark smoke
        run: uv run --group benchmark task benchmark-check
        working-directory: ovid-native
