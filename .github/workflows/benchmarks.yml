name: Benchmark smoke

on:
  pull_request:
    paths:
      - '.github/workflows/benchmarks.yml'
      - 'benchmarks/**'
      - 'python/ovid_native/ast/**'
      - 'python/ovid_native/fff/**'
      - 'python/ovid_native/search/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out ovid-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ovid-native
          persist-credentials: false
      - name: Check out ovid-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EzyGang/ovid-core
          path: ovid-core
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          working-directory: ovid-native
          enable-cache: true
          cache-dependency-glob: |
            ovid-native/uv.lock
            ovid-core/uv.lock
      - name: Install benchmark environment
        run: uv sync --locked --group benchmark
        working-directory: ovid-native
      - name: Run benchmark smoke
        run: uv run --group benchmark task benchmark-check
        working-directory: ovid-native
