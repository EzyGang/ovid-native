[package]
name = "ovid-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Complete native Rust operations for Ovid applications"
license = "MIT"
repository = "https://github.com/EzyGang/ovid-native"
homepage = "https://github.com/EzyGang/ovid-native"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py314"] }
ast-grep-core = "=0.45.1"
ast-grep-language = "=0.45.1"
fff-search = { version = "=0.10.3", default-features = false, features = ["ripgrep", "definitions"] }
globset = "=0.4.20"
ignore = "=0.4.33"
grep-matcher = "=0.1.9"
grep-pcre2 = "=0.1.10"
grep-regex = "=0.1.14"
regex = "=1.13.1"
grep-searcher = "=0.1.17"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
fs2 = "=0.4.3"
same-file = "=1.0.6"

[lints.rust]
unsafe_code = "forbid"
