[package]
name = "ovid-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Complete native Rust operations for Ovid applications"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py314"] }

[lints.rust]
unsafe_code = "forbid"
